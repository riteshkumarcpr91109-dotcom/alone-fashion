<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALONE FASHION</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#161616;color:white;padding:18px;text-align:center}
header h1{margin:0;color:#ffd166}
header p{margin:7px 0 0}
.search{display:flex;gap:8px;padding:15px;background:white;position:sticky;top:0}
input,select,button{padding:12px;border:1px solid #ddd;border-radius:7px;font-size:15px}
.search input{flex:1;min-width:0}
button{cursor:pointer;background:#171717;color:white}
.categories{display:flex;gap:8px;overflow:auto;padding:12px;background:white}
.categories button{white-space:nowrap}
.banner{background:linear-gradient(120deg,#202020,#6b3e28);color:white;padding:28px 18px}
.banner h2{font-size:27px;margin:0 0 10px}
main{padding:15px}
.section-title{display:flex;justify-content:space-between;align-items:center}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 7px #ddd}
.card img{width:100%;height:175px;object-fit:cover;background:#eee}
.card .info{padding:10px}
.card h3{font-size:15px;margin:4px 0 8px}
.price{font-weight:bold;color:#b12704}
.old{font-size:12px;color:#777;text-decoration:line-through;margin-left:5px}
.card button{width:100%;margin-top:9px}
footer{padding:25px;text-align:center;background:#171717;color:white;margin-top:25px}
.panel{background:white;padding:15px;margin:15px 0;border-radius:10px}
.panel input,.panel select{width:100%;margin:5px 0}
.hidden{display:none}
.cart-row{padding:10px 0;border-bottom:1px solid #ddd}
@media(min-width:700px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}.card img{height:230px}}
</style>
</head>
<body>
<header>
<h1>ALONE FASHION</h1>
<p>अपना स्टाइल, अपनी पहचान ✨</p>
</header>

<div class="search">
<input id="search" placeholder="प्रोडक्ट खोजें..." oninput="renderProducts()">
<button onclick="showCart()">🛒 कार्ट <span id="cartCount">0</span></button>
</div>

<div class="categories">
<button onclick="setCategory('सभी')">सभी</button>
<button onclick="setCategory('कपड़े')">कपड़े</button>
<button onclick="setCategory('जूते')">जूते</button>
<button onclick="setCategory('घड़ी')">घड़ी</button>
<button onclick="setCategory('एक्सेसरी')">एक्सेसरी</button>
</div>

<section class="banner">
<h2>नया लुक, नया अंदाज़!</h2>
<p>अपनी पसंद के फैशन प्रोडक्ट खोजें।</p>
<button onclick="document.getElementById('productsTitle').scrollIntoView()">अभी खरीदें</button>
</section>

<main>
<div class="section-title">
<h2 id="productsTitle">हमारे प्रोडक्ट</h2>
<span id="productCount"></span>
</div>
<div id="products" class="products"></div>

<section id="cartPanel" class="panel hidden">
<h2>🛒 आपका कार्ट</h2>
<div id="cartItems"></div>
<h3 id="cartTotal">कुल: ₹0</h3>
<button onclick="checkout()">ऑर्डर करें</button>
<button onclick="hideCart()">वापस जाएँ</button>
</section>

<section id="adminPanel" class="panel hidden">
<h2>Admin Panel — प्रोडक्ट जोड़ें</h2>
<input id="adminName" placeholder="Admin पासवर्ड">
<button onclick="adminLogin()">लॉगिन</button>
<div id="adminForm" class="hidden">
<input id="newName" placeholder="प्रोडक्ट का नाम">
<input id="newPrice" type="number" placeholder="कीमत ₹">
<input id="newImage" placeholder="तस्वीर का URL">
<select id="newCategory">
<option>कपड़े</option><option>जूते</option><option>घड़ी</option><option>एक्सेसरी</option>
</select>
<button onclick="addProduct()">प्रोडक्ट जोड़ें</button>
</div>
</section>
</main>

<footer>
<p>© 2026 ALONE FASHION</p>
<button onclick="openAdmin()">Admin</button>
<p>संपर्क: अपनी दुकान का संपर्क विवरण यहाँ जोड़ें।</p>
</footer>

<script>
const starterProducts=[
{id:1,name:"कैजुअल टी-शर्ट",price:499,old:799,category:"कपड़े",image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600"},
{id:2,name:"स्पोर्ट्स शूज़",price:1199,old:1799,category:"जूते",image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"},
{id:3,name:"क्लासिक घड़ी",price:899,old:1499,category:"घड़ी",image:"https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=600"},
{id:4,name:"स्टाइलिश जैकेट",price:1499,old:2199,category:"कपड़े",image:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600"},
{id:5,name:"सनग्लासेस",price:299,old:499,category:"एक्सेसरी",image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=600"},
{id:6,name:"डेनिम जीन्स",price:999,old:1599,category:"कपड़े",image:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=600"},
{id:7,name:"रनिंग शूज़",price:1299,old:1999,category:"जूते",image:"https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=600"},
{id:8,name:"फैशन बैग",price:799,old:1199,category:"एक्सेसरी",image:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600"}
];
let products=JSON.parse(localStorage.getItem("afProducts")||"null")||starterProducts;
let cart=JSON.parse(localStorage.getItem("afCart")||"[]");
let category="सभी";
function save(){localStorage.setItem("afProducts",JSON.stringify(products));localStorage.setItem("afCart",JSON.stringify(cart))}
function setCategory(c){category=c;renderProducts()}
function renderProducts(){
const q=document.getElementById("search").value.toLowerCase();
const list=products.filter(p=>(category==="सभी"||p.category===category)&&(p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)));
document.getElementById("productCount").textContent=list.length+" प्रोडक्ट";
document.getElementById("products").innerHTML=list.map(p=>`<article class="card"><img src="${p.image}" alt="${p.name}" onerror="this.src='https://placehold.co/400x300?text=Product'"><div class="info"><h3>${p.name}</h3><span class="price">₹${p.price}</span> <span class="old">₹${p.old||p.price}</span><button onclick="addToCart(${p.id})">कार्ट में डालें</button></div></article>`).join("")||"<p>कोई प्रोडक्ट नहीं मिला।</p>";
updateCartCount()
}
function addToCart(id){cart.push(id);save();updateCartCount();alert("प्रोडक्ट कार्ट में जुड़ गया!")}
function updateCartCount(){document.getElementById("cartCount").textContent=cart.length}
function showCart(){document.getElementById("cartPanel").classList.remove("hidden");renderCart();document.getElementById("cartPanel").scrollIntoView()}
function hideCart(){document.getElementById("cartPanel").classList.add("hidden")}
function renderCart(){
const items=cart.map(id=>products.find(p=>p.id===id)).filter(Boolean);
document.getElementById("cartItems").innerHTML=items.map((p,i)=>`<div class="cart-row">${p.name} — ₹${p.price} <button onclick="removeCart(${i})">हटाएँ</button></div>`).join("")||"कार्ट खाली है।";
document.getElementById("cartTotal").textContent="कुल: ₹"+items.reduce((s,p)=>s+p.price,0)
}
function removeCart(i){cart.splice(i,1);save();renderCart();updateCartCount()}
function checkout(){alert("यह शुरुआती डेमो है। वास्तविक ऑर्डर के लिए सुरक्षित बैकएंड और संपर्क/पेमेंट सिस्टम जोड़ना होगा।")}
function openAdmin(){document.getElementById("adminPanel").classList.remove("hidden");document.getElementById("adminPanel").scrollIntoView()}
function adminLogin(){if(document.getElementById("adminName").value==="alone123"){document.getElementById("adminForm").classList.remove("hidden");alert("लॉगिन हो गया।")}else alert("गलत पासवर्ड।")}
function addProduct(){
const name=document.getElementById("newName").value.trim(),price=Number(document.getElementById("newPrice").value),image=document.getElementById("newImage").value.trim(),cat=document.getElementById("newCategory").value;
if(!name||price<=0||!image){alert("नाम, सही कीमत और तस्वीर का URL भरें।");return}
products.push({id:Date.now(),name,price,old:price,category:cat,image});save();renderProducts();alert("प्रोडक्ट जुड़ गया!")
}
renderProducts();
</script>
</body>
  </html>
